name: iOS Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/.java-version

      - name: Run tests
        run: ./gradlew :shared:iosX64Test

      - name: Build and Archive
        uses: sersoft-gmbh/xcodebuild-action@v3
        with:
          project: iosApp/templateIOS.xcodeproj
          scheme: templateIOS
          destination: generic/platform=iOS
          configuration: Debug
          action: archive
          archive-path: build/templateIOS.xcarchive
          build-settings: |
            CODE_SIGN_IDENTITY=
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/templateIOS.xcarchive \
            -exportOptionsPlist iosApp/exportOptions.plist \
            -exportPath build/

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload IPA to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/templateIOS.ipa
          asset_name: templateIOS.ipa
          asset_content_type: application/octet-stream
